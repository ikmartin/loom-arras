name: loom unit

on:
  push:
    paths: ['loom/**', '.github/workflows/loom-unit.yml']
  pull_request:
    paths: ['loom/**', '.github/workflows/loom-unit.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: loom

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -m "not tex and not paper and not network"

  install-from-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install .
      - run: loom --version
      - name: doctor reports and exits 2 without TeX
        run: |
          set +e
          loom doctor
          status=$?
          set -e
          test "$status" -eq 2
