name: loom tex

on:
  push:
    paths: ['loom/**', '.github/workflows/loom-tex.yml']
  pull_request:
    paths: ['loom/**', '.github/workflows/loom-tex.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: loom

jobs:
  tex:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y poppler-utils curl git
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync
      - run: uv run pytest -m tex
