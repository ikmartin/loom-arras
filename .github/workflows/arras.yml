name: arras

# arras's lane of scripts/verify, run as it is at a terminal: `full --only arras` (svelte-check, vitest, one build, then the e2e, minimal, write and reading suites together). The write and reading suites serve with the real `loom serve` from this checkout, so a loom change runs them too. Book 14.4.

on:
  push:
    paths: ['arras/**', 'loom/**', 'scripts/**', '.github/workflows/arras.yml']
  pull_request:
    paths: ['arras/**', 'loom/**', 'scripts/**', '.github/workflows/arras.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: poppler, whose pdftotext `loom serve` needs to anchor a note on a paper (the reading suite); TeX is not needed
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: loom from this checkout, which the write and reading suites run as ../loom/.venv/bin/loom
        run: uv sync
        working-directory: loom
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arras/package-lock.json # the lock file is not at the repository root
      - run: npm ci
        working-directory: arras
      - name: the Playwright version, which decides the browser build and keys its cache
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
        working-directory: arras
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: arras
      - name: Chromium's system libraries, the browser coming from the cache
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: arras
      - run: scripts/verify full --only arras
      # the product build: scripts/verify's build step writes it with no fixture staged, and each suite serves a copy of it with its own fixture staged
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: arras/.tmp-e2e/slot-1/bundle
          include-hidden-files: true # the path runs through the hidden .tmp-e2e; the build holds no dotfile, so this uploads exactly the build
          if-no-files-found: error
