name: ci

on:
  push:
    paths: ['arras/**', '.github/workflows/arras-ci.yml']
  pull_request:
    paths: ['arras/**', '.github/workflows/arras-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: arras

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: arras/build
