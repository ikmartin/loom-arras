name: mirror loom-nvim

# A Neovim plugin manager installs a plugin from a repository whose root is the plugin, so loom-nvim/ is pushed to ikmartin/loom-nvim whenever it changes, once its suite has passed on the commit being pushed. That repository is a mirror: it takes no pull requests, and development happens here.

on:
  push:
    branches: [main]
    paths: ['loom-nvim/**']
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/clients.yml
    with:
      only: nvim

  mirror:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the split walks the whole history
          persist-credentials: false # checkout's stored header authenticates every github.com push, overriding the token below
      - name: Split loom-nvim/ and push it
        env:
          KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "MIRROR_SSH_KEY is not set; the mirror is not updated. Add the private half of a write-enabled deploy key on ikmartin/loom-nvim."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes" \
            git push git@github.com:ikmartin/loom-nvim.git "$(git subtree split --prefix=loom-nvim)":refs/heads/main
