<div data-from="tex" class="env env-definition"  data-taxon="Definition" data-style="definition" data-src="drafting/review-4e392b8f66d3eb413594.tex:0:297"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p>

<p class="noindent" data-src="drafting/review-4e392b8f66d3eb413594.tex:45:188"> A <em>widget </em>is a pair <span class="math inline">\((X,\sigma)\)</span> of a set and an involution <span class="math inline">\(\sigma\)</span> of <span class="math inline">\(X\)</span>, so that
<a  class="ref ref-eq" data-target="sy-0100-ai#eq:prose-ai" data-tex="\eqref{eq:prose-ai}" href="#sy-0100-ai-eq-prose-ai" data-at="136">(1)</a> holds. Its <em>fixed locus </em>is </p><div class="math display" data-src="drafting/review-4e392b8f66d3eb413594.tex:189:280"  data-label="eq:fix-ai" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
