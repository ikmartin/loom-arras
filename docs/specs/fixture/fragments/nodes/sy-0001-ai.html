<div data-fragment="node" class="env env-definition" id="sy-0001-ai" data-id="sy-0001-ai" data-key="sy-0001-ai" data-taxon="Definition" data-style="definition" data-src="drafting-ai/aidoc.tex:995:1292" data-pair="sy-0001" data-hash="sha256:7882b338470ed03a36848c173ce842ab7234bb92cb10a2c3810c0366596736f1"><p class="env-label"><span class="taxon">Definition</span> <span class="title">(Widget)</span></p><p data-src="drafting-ai/aidoc.tex:1039:1184">A <em>widget</em> is a pair <span class="math inline">\((X,\sigma)\)</span> of a set and an involution <span class="math inline">\(\sigma\)</span> of <span class="math inline">\(X\)</span>, so that <a id="cite-drafting-ai-aidoc-tex-1131-sy-0100-ai-eq-prose-ai" class="ref ref-eq" data-target="sy-0100-ai#eq:prose-ai" data-tex="\eqref{eq:prose-ai}" data-at="1131" href="#sy-0100-ai-eq-prose-ai">(eq:prose-ai)</a> holds. Its <em>fixed locus</em> is</p><div class="math display" data-src="drafting-ai/aidoc.tex:1184:1275" id="sy-0001-ai-eq-fix-ai" data-label="eq:fix-ai">\[\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
