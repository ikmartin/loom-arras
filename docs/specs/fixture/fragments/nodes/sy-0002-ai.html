<div data-from="tex" data-fragment="node" class="env env-lemma" id="sy-0002-ai" data-id="sy-0002-ai" data-key="sy-0002-ai" data-taxon="Lemma" data-style="plain" data-src=".loom/copies/aidoc.tex:1518:1716" data-pair="sy-0002" data-hash="sha256:c596f2277a0520bd9f9c67fd7c5df4596b187bdd1a80fa3dbb034cd6c9e54de0"><p class="env-label"><span class="taxon">Lemma</span> <span class="number">1.3</span> <span class="title">(Orbits)</span></p>
  
<p class="noindent" data-src=".loom/copies/aidoc.tex:1558:1703">Every orbit of a widget has at most two points, and one
exactly when its point is fixed; compare <a id="cite-loom-copies-aidoc-tex-1655-sy-0001-ai-eq-fix-ai" class="ref ref-eq" data-target="sy-0001-ai#eq:fix-ai" data-tex="\eqref{eq:fix-ai}" href="#sy-0001-ai-eq-fix-ai" data-at="1655">(2)</a> in Definition   <a id="cite-loom-copies-aidoc-tex-1687-sy-0001-ai" class="ref" data-target="sy-0001-ai" data-tex="\ref{sy-0001-ai}" href="#sy-0001-ai" data-at="1687">1.1</a>.</p></div><details class="env env-proof" id="sy-0002-ai-proof" data-key="sy-0002-ai/proof" data-of="sy-0002-ai" data-src=".loom/copies/aidoc.tex:1717:1883" data-pair="sy-0002/proof" data-hash="sha256:57e15b9a88a2cb06719fc7d1dc7e1599e042189b955244fecd419d9e3497e57c" open=""><summary class="env-label">Proof</summary>
  
<p data-src=".loom/copies/aidoc.tex:1731:1776">The orbit of <span class="math inline">\(x\)</span> is <span class="math inline">\(\{x, \sigma x\}\)</span> because </p><div class="math display" data-src=".loom/copies/aidoc.tex:1777:1847" id="sy-0002-ai-proof-eq-step-ai" data-label="eq:step-ai" data-number="3">\[\tag{3}\sigma(\sigma x) = x\]</div><p> by <a id="cite-loom-copies-aidoc-tex-1851-sy-0100-ai-eq-prose-ai" class="ref ref-eq" data-target="sy-0100-ai#eq:prose-ai" data-tex="\eqref{eq:prose-ai}" href="#sy-0100-ai-eq-prose-ai" data-at="1851">(1)</a>. <span class="qed">□</span></p></details>
