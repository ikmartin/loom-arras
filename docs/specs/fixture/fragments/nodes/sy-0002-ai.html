<div data-fragment="node" class="env env-lemma" id="sy-0002-ai" data-id="sy-0002-ai" data-key="sy-0002-ai" data-taxon="Lemma" data-style="plain" data-src="drafting-ai/aidoc.tex:1518:1716"><p class="env-label"><span class="taxon">Lemma</span> <span class="title">(Orbits)</span></p><p data-src="drafting-ai/aidoc.tex:1557:1705">Every orbit of a widget has at most two points, and one exactly when its point is fixed; compare <a id="cite-drafting-ai-aidoc-tex-1655-sy-0001-ai-eq-fix-ai" class="ref ref-eq" data-target="sy-0001-ai#eq:fix-ai" data-tex="\eqref{eq:fix-ai}" data-at="1655" href="#sy-0001-ai-eq-fix-ai">(eq:fix-ai)</a> in Definition <a id="cite-drafting-ai-aidoc-tex-1687-sy-0001-ai" class="ref" data-target="sy-0001-ai" data-tex="\ref{sy-0001-ai}" data-at="1687" href="#sy-0001-ai">Widget</a>.</p></div><details class="env env-proof" id="sy-0002-ai-proof" data-key="sy-0002-ai/proof" data-of="sy-0002-ai" data-src="drafting-ai/aidoc.tex:1717:1883" open><summary class="env-label">Proof</summary><p data-src="drafting-ai/aidoc.tex:1730:1777">The orbit of <span class="math inline">\(x\)</span> is <span class="math inline">\(\{x, \sigma x\}\)</span> because</p><div class="math display" data-src="drafting-ai/aidoc.tex:1777:1847" id="sy-0002-ai-proof-eq-step-ai" data-label="eq:step-ai">\[\sigma(\sigma x) = x\]</div><p data-src="drafting-ai/aidoc.tex:1847:1872">by <a id="cite-drafting-ai-aidoc-tex-1851-sy-0100-ai-eq-prose-ai" class="ref ref-eq" data-target="sy-0100-ai#eq:prose-ai" data-tex="\eqref{eq:prose-ai}" data-at="1851" href="#sy-0100-ai-eq-prose-ai">(eq:prose-ai)</a>.</p></details>
