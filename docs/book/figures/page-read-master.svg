s = S ∘ σ does not</text><text x="318" y="120" class="serif" text-anchor="start" >depend on ι.</text><text x="318" y="144" class="ts" text-anchor="start" >▾  Proof.  accepted</text><rect x="318" y="152" width="100" height="12" class="hl" /><text x="318" y="162" class="serif" text-anchor="start" >the inclusion is open by the rigidity lemma,</text><text x="318" y="178" class="serif" text-anchor="start" >so the residue agrees.</text><rect x="432" y="9" width="159" height="342" class="rail" /><text x="444" y="36" class="tm" text-anchor="start" >COMMENTS</text><rect x="440" y="44" width="142" height="40" class="badbg" rx="6"/><text x="448" y="58" class="bad" text-anchor="start" font-size="9">objection · referee run</text><text x="448" y="72" class="bad" text-anchor="start" font-size="10">No rigidity lemma exists.</text><rect x="440" y="92" width="142" height="36" class="card" rx="6"/><text x="448" y="106" class="tm" text-anchor="start" >question · Tom</text><text x="448" y="120" class="ts" text-anchor="start" >Is quasi-compactness needed?</text></svg>