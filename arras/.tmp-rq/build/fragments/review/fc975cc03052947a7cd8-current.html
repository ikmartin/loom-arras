<div class="env env-convention"  data-taxon="Convention" data-style="definition" data-src="review/sh-0001:0:313"><p class="env-label"><span class="taxon">Convention</span></p><p data-src="review/sh-0001:33:297">Every quiver in this paper is finite: both <span class="math inline">\(V(\quiv)\)</span> and <span class="math inline">\(A(\quiv)\)</span> are finite sets, and loops and parallel arrows are <mark class="review-changed">allowed, a loop counting as one arrow and contributing no divergence.</mark> All lattices are free abelian groups of finite rank, written additively.</p></div>
