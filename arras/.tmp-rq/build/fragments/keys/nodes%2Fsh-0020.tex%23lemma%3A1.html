<div data-fragment="node" class="env env-lemma" id="nodes-sh-0020-tex-lemma-1" data-key="nodes/sh-0020.tex#lemma:1" data-taxon="Lemma" data-style="plain" data-src="nodes/sh-0020.tex:0:209"><p class="env-label"><span class="taxon">Lemma</span> <span class="title">(Defect)</span></p><p data-src="nodes/sh-0020.tex:36:198">The defect of a quiver divides the order of the torsion subgroup of <span class="math inline">\(W(\quiv) / \Zcyc(\quiv)\)</span>, which is trivial by saturation, so the defect of a quiver is one.</p></div>
