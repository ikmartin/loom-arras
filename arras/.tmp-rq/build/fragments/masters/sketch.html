<h1 data-fragment="master" data-src="drafting/sketch.tex:0:0">Sketch: the defect of a quiver</h1><p data-src="drafting/sketch.tex:240:324">Notes towards a second paper, kept in the drafting directory so that loom sees them.</p><div class="env env-lemma" id="drafting-sketch-tex-lemma-1" data-key="drafting/sketch.tex#lemma:1" data-taxon="Lemma" data-style="plain" data-src="drafting/sketch.tex:326:535"><p class="env-label"><span class="taxon">Lemma</span> <span class="title">(Defect)</span></p><p data-src="drafting/sketch.tex:362:524">The defect of a quiver divides the order of the torsion subgroup of <span class="math inline">\(W(\quiv) / \Zcyc(\quiv)\)</span>, which is trivial by saturation, so the defect of a quiver is one.</p></div>
