<div data-fragment="node" class="env env-proposition" id="arden24-prop-2-1" data-id="Arden24-prop-2.1" data-key="Arden24-prop-2.1" data-taxon="Proposition" data-style="plain" data-src="digests/Arden24.tex:1915:2285" data-macros="Arden24"><p class="env-label"><span class="taxon">Proposition</span> <span class="title">(<span class="cite" data-citekey="Arden24" data-postnote="Proposition 2.1, p.~1">[Arden24, Proposition 2.1, p. 1]</span>)</span></p><p data-src="digests/Arden24.tex:2000:2268" data-annotation="a-2026-09-16-0009" class="annotation-block">Let <span class="math inline">\(Q\)</span> be a quiver whose underlying graph has <span class="math inline">\(c\)</span> connected components. The image of the divergence map is the lattice of integer vectors in <span class="math inline">\(\mathbb{Z}^{V(Q)}\)</span> whose coordinates sum to zero on each component, and its rank is <span class="math inline">\(|V(Q)| - c\)</span>.</p></div>
