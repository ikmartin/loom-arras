<div data-fragment="node" class="env env-convention" id="sh-0001" data-id="sh-0001" data-key="sh-0001" data-taxon="Convention" data-style="definition" data-src="nodes/sh-0001.tex:0:313"><p class="env-label"><span class="taxon">Convention</span></p><p data-src="nodes/sh-0001.tex:33:297">Every quiver in this paper is finite: both <span class="math inline">\(V(\quiv)\)</span> and <span class="math inline">\(A(\quiv)\)</span> are finite sets, and loops and parallel arrows are allowed, a loop counting as one arrow and contributing no divergence. All lattices are free abelian groups of finite rank, written additively.</p></div>
