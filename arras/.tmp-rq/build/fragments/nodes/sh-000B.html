<div data-fragment="node" class="env env-definition" id="sh-000b" data-id="sh-000B" data-key="sh-000B" data-taxon="Definition" data-style="definition" data-src="nodes/sh-000B.tex:0:222"><p class="env-label"><span class="taxon">Definition</span> <span class="title">(Height)</span></p><p data-src="nodes/sh-000B.tex:41:206">The <em>height</em> of a weighting <span class="math inline">\(w\)</span> is <span class="math inline">\(\|w\| = \max_{a \in A(\quiv)} |w(a)|\)</span>, and <span class="math inline">\(N_{\quiv}(k)\)</span> denotes the number of balanced weightings of height at most <span class="math inline">\(k\)</span>.</p></div>
