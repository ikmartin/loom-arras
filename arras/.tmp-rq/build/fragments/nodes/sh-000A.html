<div data-fragment="node" class="env env-corollary" id="sh-000a" data-id="sh-000A" data-key="sh-000A" data-taxon="Corollary" data-style="plain" data-src="nodes/sh-000A.tex:0:123"><p class="env-label"><span class="taxon">Corollary</span> <span class="title">(Trees)</span></p><p data-src="nodes/sh-000A.tex:39:108"><mark class="annotation" data-annotation="a-2026-09-16-0017">A quiver whose underlying graph is a forest</mark> has <span class="math inline">\(\Zcyc(\quiv) = 0\)</span>.</p></div><details class="env env-proof" id="sh-000a-proof" data-key="sh-000A/proof" data-of="sh-000A" data-src="nodes/sh-000A.tex:124:367" open><summary class="env-label">Proof</summary><p data-src="nodes/sh-000A.tex:138:356">A forest on <span class="math inline">\(|V(\quiv)|\)</span> vertices with <span class="math inline">\(c\)</span> components has exactly <span class="math inline">\(|V(\quiv)| - c\)</span> edges, so Theorem <a id="cite-nodes-sh-000a-tex-254-sh-0009" class="ref" data-target="sh-0009" href="#sh-0009">sh-0009</a> and <a id="cite-nodes-sh-000a-tex-272-sh-0009-eq-rank" class="ref ref-eq" data-target="sh-0009#eq:rank" href="#sh-0009-eq-rank">(eq:rank)</a> give rank zero, and a saturated sublattice of rank zero is trivial.</p></details>
