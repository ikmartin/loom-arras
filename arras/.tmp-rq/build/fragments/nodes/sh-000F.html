<div data-fragment="node" class="env env-remark" id="sh-000f" data-id="sh-000F" data-key="sh-000F" data-taxon="Remark" data-style="remark" data-src="nodes/sh-000F.tex:0:287"><p class="env-label"><span class="taxon">Remark</span></p><p data-src="nodes/sh-000F.tex:73:275">Every statement above is about a finite quiver. For an infinite quiver with finite valence the cycle lattice is still saturated, but its rank is no longer given by <a id="cite-nodes-sh-000f-tex-237-sh-0009-eq-rank" class="ref ref-eq" data-target="sh-0009#eq:rank" href="#sh-0009-eq-rank">(eq:rank)</a>; see <span class="cite" data-citekey="Cortez07">[Cortez07]</span>.</p></div>
