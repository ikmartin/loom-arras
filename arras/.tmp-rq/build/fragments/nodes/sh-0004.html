<div data-fragment="node" class="env env-definition" id="sh-0004" data-id="sh-0004" data-key="sh-0004" data-taxon="Definition" data-style="definition" data-src="nodes/sh-0004.tex:0:328"><p class="env-label"><span class="taxon">Definition</span> <span class="title">(Balanced weighting)</span></p><p data-src="nodes/sh-0004.tex:53:153">A weighting <span class="math inline">\(w\)</span> is <em>balanced</em> if <span class="math inline">\(\bd w = 0\)</span>, and the balanced weightings form the sublattice</p><div class="math display" data-src="nodes/sh-0004.tex:153:260" id="sh-0004-eq-cycle-lattice" data-label="eq:cycle-lattice">\[\Zcyc(\quiv) \;=\; \ker \bd \;\subseteq\; W(\quiv),\]</div><p data-src="nodes/sh-0004.tex:260:312">which we call the <em>cycle lattice</em> of <span class="math inline">\(\quiv\)</span>.</p></div>
