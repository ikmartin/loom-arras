<div data-fragment="node" class="env env-example" id="sh-0005" data-id="sh-0005" data-key="sh-0005" data-taxon="Example" data-style="definition" data-src="nodes/sh-0005.tex:0:235"><p class="env-label"><span class="taxon">Example</span></p><p data-src="nodes/sh-0005.tex:30:222">For the quiver with one vertex and <span class="math inline">\(n\)</span> loops, every weighting is balanced and <span class="math inline">\(\Zcyc(\quiv) = \ZZ^{n}\)</span>. For a single arrow between two distinct vertices, only the zero weighting is balanced.</p></div>
