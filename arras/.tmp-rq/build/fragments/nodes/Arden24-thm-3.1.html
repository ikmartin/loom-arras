<div data-fragment="node" class="env env-theorem" id="arden24-thm-3-1" data-id="Arden24-thm-3.1" data-key="Arden24-thm-3.1" data-taxon="Theorem" data-style="plain" data-src="digests/Arden24.tex:2607:2960" data-macros="Arden24"><p class="env-label"><span class="taxon">Theorem</span> <span class="title">(<span class="cite" data-citekey="Arden24" data-postnote="Theorem 3.1, p.~2">[Arden24, Theorem 3.1, p. 2]</span>)</span></p><p data-src="digests/Arden24.tex:2683:2947">Let <span class="math inline">\(Q\)</span> be a quiver whose underlying graph has <span class="math inline">\(c\)</span> connected components. Then the cycle space of <span class="math inline">\(Q\)</span> is a free abelian group of rank <span class="math inline">\(|A(Q)| - |V(Q)| + c\)</span>, and this rank depends only on the underlying graph of <span class="math inline">\(Q\)</span>.</p></div>
