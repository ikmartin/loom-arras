<div data-fragment="node" class="env env-definition" id="arden24-def-1-1" data-id="Arden24-def-1.1" data-key="Arden24-def-1.1" data-taxon="Definition" data-style="definition" data-src="digests/Arden24.tex:1148:1436" data-macros="Arden24"><p class="env-label"><span class="taxon">Definition</span> <span class="title">(<span class="cite" data-citekey="Arden24" data-postnote="Definition 1.1, p.~1">[Arden24, Definition 1.1, p. 1]</span>)</span></p><p data-src="digests/Arden24.tex:1230:1420">A <em>quiver</em> is a quadruple <span class="math inline">\(Q = (V, A, s, t)\)</span> in which <span class="math inline">\(V\)</span> and <span class="math inline">\(A\)</span> are finite sets and <span class="math inline">\(s, t \colon A \to V\)</span> are functions, called the source and target maps.</p></div>
