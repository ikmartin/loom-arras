[project]
name = "arras"
version = "0.1.0a0"
description = "The arras viewer bundle, packaged for pip so loom users never install Node."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "ikmartin" }]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arras"]
