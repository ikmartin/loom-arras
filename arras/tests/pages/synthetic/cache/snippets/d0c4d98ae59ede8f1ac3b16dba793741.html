<strong>Definition 0.1 </strong>(Widget)<strong>.</strong>  </span> A <span data-font="it">widget </span>is a pair <span class="math inline">\((X,\sigma )\)</span> of a set and an involution <span class="math inline">\(\sigma \)</span> of <span class="math inline">\(X\)</span>, so that
(  <a class="ref" data-label="eq:prose-ai" data-made="">1</a>) holds. Its <span data-font="it">fixed locus </span>is </p><div class="math display" data-at=":1">\begin{equation}\label {eq:fix-ai} \Fix (\sigma ) = \{x \in X : \sigma x = x\}. \end{equation}</div>
