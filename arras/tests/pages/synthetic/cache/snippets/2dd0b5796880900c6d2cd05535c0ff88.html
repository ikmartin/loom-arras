<strong>Definition 1.1 </strong>(Widget)<strong>.</strong>  </span> A <span data-font="it">widget </span>is a pair <span class="math inline">\((X,\sigma )\)</span> with <span class="math inline">\(\sigma \colon X\to X\)</span> satisfying (  <a class="ref" data-label="eq:prose" data-made="">1</a>). Its fixed locus is
</p><div class="math display" data-at=":1">\begin{equation}\label {eq:fix} \Fix (\sigma ) = \{x \in X : \sigma x = x\}. \end{equation}</div></div>
