<p class="noindent" data-at=":1"><span class="head" data-made="">

<strong>Convention 0.1.</strong>  </span> Every quiver in this paper is finite: both <span class="math inline">\(V(\quiv )\)</span> and <span class="math inline">\(A(\quiv )\)</span> are finite
sets, and loops and parallel arrows are allowed, a loop counting as one arrow
and contributing no divergence. All lattices are free abelian groups of finite
rank, written additively.
</p>
