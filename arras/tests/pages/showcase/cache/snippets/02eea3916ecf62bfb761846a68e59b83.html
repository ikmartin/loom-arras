<strong>Proposition 2.1 </strong>(<span class="cite" data-made="">[<strong>?</strong>, Proposition 2.1, p. 1]</span>)<strong>.</strong>  </span>  <span data-font="it">Let  </span><span class="math inline">\(Q\)</span> <span data-font="it">be  a  quiver  whose
