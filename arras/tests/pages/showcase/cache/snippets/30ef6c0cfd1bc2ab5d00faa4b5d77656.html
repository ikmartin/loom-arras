<strong>Theorem 3.1 </strong>(<span class="cite" data-made="">[<span class="cite-label" data-citekey="Arden24" data-made="">1</span>, Theorem 3.1, p. 2]</span>)<strong>.</strong>  </span>  <span data-font="it">Let </span><span class="math inline">\(Q\)</span> <span data-font="it">be a quiver whose underlying
graph has </span><span class="math inline">\(c\)</span> <span data-font="it">connected components. Then the cycle space of </span><span class="math inline">\(Q\)</span> <span data-font="it">is a free abelian
group of rank </span><span class="math inline">\(|A(Q)| - |V(Q)| + c\)</span><span data-font="it">, and this rank depends only on the underlying graph of </span><span class="math inline">\(Q\)</span><span data-font="it">.</span>
