<div class="env env-definition"  data-taxon="Definition" data-style="definition" data-src="review/997af6fee81e9405adb9.tex:0:288"><p class="env-label"><span class="taxon">Definition</span> <span class="title">(Widget)</span></p><p data-src="review/997af6fee81e9405adb9.tex:41:183">A <em>widget</em> is a pair<mark class="review-changed"> </mark><span class="math inline review-changed">\((X,\sigma)\)</span> of a set and an involution <span class="math inline review-changed">\(\sigma\)</span><mark class="review-changed"> </mark>of <span class="math inline review-changed">\(X\)</span><mark class="review-changed">,</mark> so that <a  class="ref ref-eq" data-target="sy-0100#eq:prose" data-tex="\eqref{eq:prose}" data-at="133" href="#sy-0100-eq-prose">(eq:prose)</a> holds. Its <em><mark class="review-changed">fixed</mark> <mark class="review-changed">locus</mark></em> is</p><div class="math display" data-src="review/997af6fee81e9405adb9.tex:183:271"  data-label="eq:fix">\[\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
