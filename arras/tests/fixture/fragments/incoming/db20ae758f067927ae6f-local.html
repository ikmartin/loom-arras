<div class="env env-definition"  data-taxon="Definition" data-style="definition" data-src="review/sy-0001:0:258"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p><p data-src="review/sy-0001:41:153">A <em>widget</em> is a pair<span class="review-change-point" aria-label="edit point"></span> of a set and an involution <span class="review-change-point" aria-label="edit point"></span>of <mark class="review-changed">it,</mark> so that <a  class="ref ref-eq" data-target="sy-0100#eq:prose" data-tex="\eqref{eq:prose}" data-at="110" href="#sy-0100-eq-prose">(1)</a> holds. Its <mark class="review-changed">fixed</mark> <mark class="review-changed">locus</mark> is</p><div class="math display" data-src="review/sy-0001:153:241"  data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
