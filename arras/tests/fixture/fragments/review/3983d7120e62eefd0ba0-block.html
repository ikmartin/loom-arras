<div class="env env-definition"  data-taxon="Definition" data-style="definition" data-src="review/997af6fee81e9405adb9.tex:0:297"><p class="env-label"><span class="taxon">Definition</span> <span class="title">(Widget)</span></p><p data-src="review/997af6fee81e9405adb9.tex:44:189">A <em>widget</em> is a pair <span class="math inline">\((X,\sigma)\)</span> of a set and an involution <span class="math inline">\(\sigma\)</span> of <span class="math inline">\(X\)</span>, so that <a  class="ref ref-eq" data-target="sy-0100-ai#eq:prose-ai" data-tex="\eqref{eq:prose-ai}" data-at="136" href="#sy-0100-ai-eq-prose-ai">(eq:prose-ai)</a> holds. Its <em>fixed locus</em> is</p><div class="math display" data-src="review/997af6fee81e9405adb9.tex:189:280"  data-label="eq:fix-ai">\[\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
