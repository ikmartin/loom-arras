<div class="env env-definition"  data-taxon="Definition" data-style="definition" data-src="review/sy-0001:0:261"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p><p data-src="review/sy-0001:41:156">A <em>widget</em> is a pair <span class="math inline review-changed">\((X,\sigma)\)</span> <mark class="review-changed">with</mark> <span class="math inline review-changed">\(\sigma\colon X\to X\)</span> <mark class="review-changed">satisfying</mark> <a  class="ref ref-eq" data-target="sy-0100#eq:prose" href="#sy-0100-eq-prose">(1)</a><mark class="review-changed">.</mark> Its fixed locus is</p><div class="math display" data-src="review/sy-0001:156:244"  data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
