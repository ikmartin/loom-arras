<p class="noindent" data-src="drafting/review-d5232fdb871ac4cd714f.tex:42:155"> A <em>widget </em>is a pair <span class="math inline review-changed">\((X,\sigma)\)</span> <mark class="review-changed">with</mark> <span class="math inline review-changed">\(\sigma\colon X\to X\)</span> <mark class="review-changed">satisfying</mark> <a  class="ref ref-eq" data-target="sy-0100#eq:prose" data-tex="\eqref{eq:prose}" href="#sy-0100-eq-prose" data-at="119">(1)</a>. Its fixed <mark class="review-changed">locus</mark> is
</p><div class="math display" data-src="drafting/review-d5232fdb871ac4cd714f.tex:156:244"  data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
