<div data-from="tex" class="env env-definition"  data-taxon="Definition" data-style="definition" data-src="drafting/review-02cd149893e6a1bf75cb.tex:0:288"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p>

<p class="noindent" data-src="drafting/review-02cd149893e6a1bf75cb.tex:42:182"> A <em>widget </em>is a pair of a set and an involution of it, so that
<a  class="ref ref-eq" data-target="sy-0100#eq:prose" data-tex="\eqref{eq:prose}" href="#sy-0100-eq-prose" data-at="110">(1)</a> holds. Its fixed locus, the set of its fixed points, is </p><div class="math display" data-src="drafting/review-02cd149893e6a1bf75cb.tex:183:271"  data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
