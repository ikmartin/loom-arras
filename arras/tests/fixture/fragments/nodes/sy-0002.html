<div data-fragment="node" class="env env-lemma" data-id="sy-0002" data-key="sy-0002" data-taxon="Lemma" data-style="plain" data-src="nodes/sy-0002.tex:93:240"><p class="env-label"><span class="taxon">Lemma</span> <span class="number">1.2</span> <span class="title">(Orbits)</span></p><p data-src="nodes/sy-0002.tex:129:229">Every orbit of a widget has <mark class="annotation" data-annotation="a-2026-09-16-0003">one or two points</mark>; compare <a class="ref ref-eq" data-target="sy-0001#eq:fix" href="#sy-0001-eq-fix">(2)</a> in Definition <a class="ref" data-target="sy-0001" href="#sy-0001">1.1</a>.</p></div><details class="env env-proof" data-key="sy-0002/proof" data-of="sy-0002" data-src="nodes/sy-0002.tex:241:401" open><summary class="env-label">Proof</summary><p data-src="nodes/sy-0002.tex:254:301">The orbit of <span class="math inline">\(x\)</span> is <span class="math inline">\(\{x, \sigma x\}\)</span> because</p><div class="math display" data-src="nodes/sy-0002.tex:301:368" id="sy-0002-proof-eq-step" data-label="eq:step" data-number="3">\[\tag{3}\sigma(\sigma x) = x\]</div><p data-src="nodes/sy-0002.tex:368:390">by <a class="ref ref-eq" data-target="sy-0100#eq:prose" href="#sy-0100-eq-prose">(1)</a>.</p></details>
