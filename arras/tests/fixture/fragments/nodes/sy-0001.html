<div data-fragment="node" class="env env-definition" data-id="sy-0001" data-key="sy-0001" data-taxon="Definition" data-style="definition" data-src="drafts/main.tex:1046:1307"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p><p data-src="drafts/main.tex:1087:1202">A <em>widget</em> is a pair <span class="math inline">\((X,\sigma)\)</span> with <span class="math inline">\(\sigma\colon X\to X\)</span> satisfying <a class="ref ref-eq" data-target="sy-0100#eq:prose" href="#sy-0100-eq-prose">(1)</a>. Its fixed locus is</p><div class="math display" data-src="drafts/main.tex:1202:1290" id="sy-0001-eq-fix" data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
