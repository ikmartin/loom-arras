<div data-fragment="node" class="env env-definition" id="sy-0001" data-id="sy-0001" data-key="sy-0001" data-taxon="Definition" data-style="definition" data-src="drafting/main.tex:1046:1304"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p><p data-src="drafting/main.tex:1087:1199">A <em>widget</em> is a pair of a set and an involution of it, so that <a id="cite-drafting-main-tex-1156-sy-0100-eq-prose" class="ref ref-eq" data-target="sy-0100#eq:prose" data-tex="\eqref{eq:prose}" data-at="1156" href="#sy-0100-eq-prose">(1)</a> holds. Its fixed locus is</p><div class="math display" data-src="drafting/main.tex:1199:1287" id="sy-0001-eq-fix" data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
