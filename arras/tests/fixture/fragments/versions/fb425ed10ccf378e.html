<div data-from="tex" class="env env-definition"  data-taxon="Definition" data-style="definition" data-src="drafting/review-fb425ed10ccf378e883a.tex:0:281"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p>

<p class="noindent" data-src="drafting/review-fb425ed10ccf378e883a.tex:42:175"> A <em>widget </em>is a pair <span class="math inline">\((X,\sigma)\)</span> of a set and <mark class="annotation" data-annotation="a-2026-09-16-a91hwf">an involution <span class="math inline">\(\sigma\)</span> of <span class="math inline">\(X\)</span></mark>, so that
<a  class="ref ref-eq" data-target="sy-0100#eq:prose" data-tex="\eqref{eq:prose}" href="#sy-0100-eq-prose" data-at="133">(1)</a> holds. Its fixed locus is </p><div class="math display" data-src="drafting/review-fb425ed10ccf378e883a.tex:176:264"  data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
