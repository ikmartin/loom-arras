<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// The stored preferences are applied before the first paint: the app renders client-side, so without this the page flashes the default theme and width (book 15.7).
			try {
				var p = JSON.parse(localStorage.getItem('arras.prefs') || '{}');
				var e = document.documentElement;
				if (['a', 'c'].indexOf(p.shell) >= 0) e.setAttribute('data-shell', p.shell);
				if (['serif', 'sans'].indexOf(p.face) >= 0) e.setAttribute('data-face', p.face);
				if (['s', 'm', 'l'].indexOf(p.size) >= 0) e.setAttribute('data-size', p.size);
				if (['narrow', 'mid', 'wide'].indexOf(p.width) >= 0) e.setAttribute('data-width', p.width);
				if (p.theme === 'light' || p.theme === 'dark') e.setAttribute('data-theme', p.theme);
				if (p.comments === 'inline') e.setAttribute('data-comments', 'inline');
			} catch (err) {
				/* no stored preferences, or storage is unavailable: the defaults stand */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
