<!-- `class="arras"` is the host opting its root element in to arras's tokens and box-sizing (src/lib/theme.css). The app served with loom puts it on <html>, which is also where the preference attributes below are written; a host embedding a corpus in part of a page puts it on that part instead. -->

				if (['s', 'm', 'l'].indexOf(p.size) >= 0) e.setAttribute('data-size', p.size);
				if (['narrow', 'mid', 'wide'].indexOf(p.width) >= 0) e.setAttribute('data-width', p.width);
				if (p.theme === 'light' || p.theme === 'dark') e.setAttribute('data-theme', p.theme);
				if (p.comments === 'inline') e.setAttribute('data-comments', 'inline');
			} catch (err) {
				/* no stored preferences, or storage is unavailable: the defaults stand */
			}
		</script>
