<div class="env env-definition"  data-taxon="Definition" data-style="definition" data-src="review/sy-0001:0:258"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p><p data-src="review/sy-0001:41:153">A <em>widget</em> is a pair <mark class="review-changed">of</mark> <mark class="review-changed">a</mark> <mark class="review-changed">set</mark> <mark class="review-changed">and</mark> <mark class="review-changed">an</mark> <mark class="review-changed">involution</mark> <mark class="review-changed">of it, so that </mark><a  class="ref ref-eq" data-target="sy-0100#eq:prose" href="#sy-0100-eq-prose">(1)</a><mark class="review-changed"> holds.</mark> Its fixed locus is</p><div class="math display" data-src="review/sy-0001:153:241"  data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
