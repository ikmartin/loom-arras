<p class="noindent" data-src="drafting/main.tex:1088:1198"> A <em>widget </em>is a pair of a set and<mark class="annotation gone" data-annotation="a-2026-09-16-a91hwf"></mark> an involution of it, so that
<a id="cite-drafting-main-tex-1156-sy-0100-eq-prose" class="ref ref-eq" data-target="sy-0100#eq:prose" data-tex="\eqref{eq:prose}" href="#sy-0100-eq-prose" data-at="1156">(1)</a> holds. Its fixed locus is </p><div class="math display" data-src="drafting/main.tex:1199:1287" id="sy-0001-eq-fix" data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
