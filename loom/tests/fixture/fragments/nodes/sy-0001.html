<div data-fragment="node" class="env env-definition" id="sy-0001" data-id="sy-0001" data-key="sy-0001" data-taxon="Definition" data-style="definition" data-src="drafts/main.tex:1046:1327"><p class="env-label"><span class="taxon">Definition</span> <span class="number">1.1</span> <span class="title">(Widget)</span></p><p data-src="drafts/main.tex:1087:1222">A <em>widget</em> is a pair <span class="math inline">\((X,\sigma)\)</span> of a set and an involution <span class="math inline">\(\sigma\)</span> of <span class="math inline">\(X\)</span>, so that <a class="ref ref-eq" data-target="sy-0100#eq:prose" href="#sy-0100-eq-prose">(1)</a> holds. Its fixed locus is</p><div class="math display" data-src="drafts/main.tex:1222:1310" id="sy-0001-eq-fix" data-label="eq:fix" data-number="2">\[\tag{2}\Fix(\sigma) = \{x \in X : \sigma x = x\}.\]</div></div>
