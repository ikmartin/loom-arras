[quilt]
name = "The loom showcase"
main = "drafting/main-atomic.tex"    # default master
drafting = "drafting"           # working documents, every one live
prefix = "sh"               # default id prefix for loom new
engine = "pdflatex"         # default engine; % !TEX program in a master overrides

[library]
online = false              # may loom library update look identifiers up (zbMATH Open, Crossref) and fetch documents (arXiv); --online allows one run

[lint]
disable = []                # diagnostic codes to silence, e.g. ["loom:unmatched-postnote"]

[author]
name = "The loom showcase"  # who this quilt's records name; empty until you write it here or pass --author
